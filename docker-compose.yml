# Uso: cp .env.example .env  (preencha os valores)  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: borges
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: borges
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borges"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      BORGES_ENV: production
      BORGES_DATABASE_URL: postgresql+psycopg://borges:${POSTGRES_PASSWORD}@db:5432/borges
      BORGES_SECRET_KEY: ${BORGES_SECRET_KEY:?defina BORGES_SECRET_KEY no .env}
      BORGES_ADMIN_EMAIL: ${BORGES_ADMIN_EMAIL:-admin@borges.local}
      BORGES_ADMIN_PASSWORD: ${BORGES_ADMIN_PASSWORD:?defina BORGES_ADMIN_PASSWORD no .env}
      # Local, sem HTTPS. Atrás de HTTPS, defina como "true".
      BORGES_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
