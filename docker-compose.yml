# Uso: cp .env.example .env  (preencha os valores)  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: borges
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: borges
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borges"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment: &backend-env
      BORGES_ENV: production
      BORGES_DATABASE_URL: postgresql+psycopg://borges:${POSTGRES_PASSWORD}@db:5432/borges
      BORGES_SECRET_KEY: ${BORGES_SECRET_KEY:?defina BORGES_SECRET_KEY no .env}
      BORGES_ENCRYPTION_KEY: ${BORGES_ENCRYPTION_KEY:?defina BORGES_ENCRYPTION_KEY no .env}
      BORGES_WINDSOR_ALLOWED_ACCOUNTS: ${BORGES_WINDSOR_ALLOWED_ACCOUNTS:-}
      BORGES_ADMIN_EMAIL: ${BORGES_ADMIN_EMAIL:-admin@borges.local}
      BORGES_ADMIN_PASSWORD: ${BORGES_ADMIN_PASSWORD:?defina BORGES_ADMIN_PASSWORD no .env}
      # Local, sem HTTPS. Atrás de HTTPS, defina como "true".
      BORGES_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  # Rotinas automáticas (auditoria diária, relatórios, revisões). Espera a API criar/migrar o banco.
  worker:
    build: ./backend
    command: ["sh", "-c", "python -m app.cli wait-api http://api:8000/api/health --seconds 300 && python -m app.worker"]
    environment: *backend-env
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
